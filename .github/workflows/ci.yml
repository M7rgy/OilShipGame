name: CI

on:
  push:
  pull_request:

jobs:
  render-test:
    name: Headless render smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Electron's binary is not needed for the headless browser test
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Install Chromium for playwright-core
        run: npx playwright@1.61.1 install --with-deps chromium

      - name: Run render smoke test
        run: npm run test:render

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-screenshots
          path: test/screenshots/
          if-no-files-found: ignore
